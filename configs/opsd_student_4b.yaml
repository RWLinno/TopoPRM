# OPSD student distillation: teacher = 9B SRT, student = Qwen3.5-4B
# Student rollouts are on-policy; teacher provides per-token targets.
student_base: ${HF_MODELS_DIR:-./models}/Qwen/Qwen3.5-4B
student_adapter: ""   # empty = use base directly

teacher_base: ${HF_MODELS_DIR:-./models}/Qwen/Qwen3.5-9B
teacher_adapter: ""   # set to output/srt_9b/final when Stage III-A is ready

dataset: data/grpo_ready/train_public.jsonl
dataset_split: D2

num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 3e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_length: 4096
max_new_tokens: 1024
bf16: true
gradient_checkpointing: true

kl_temperature: 1.0
topo_threshold: 0.5
use_topo_aware_pr: true

logging_steps: 10
save_steps: 100
save_total_limit: 3
output_dir: output/opsd_student_4b
