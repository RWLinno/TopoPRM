# Canonical Stage-I warm start for the ICLR 2027 run.
model: /Knowin/foundation/weilinruan/hf_models/Qwen/Qwen3.5-9B

tuner_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
target_modules: all-linear
torch_dtype: bfloat16

dataset:
  - /knowin-oss/weilinruan/TopoPRM_ICLR27/canonical/sft_data/train.jsonl
val_dataset:
  - /knowin-oss/weilinruan/TopoPRM_ICLR27/canonical/sft_data/validation.jsonl

max_length: 4096
num_train_epochs: 3
learning_rate: 5.0e-5
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
gradient_checkpointing: true
deepspeed: zero2

eval_strategy: steps
eval_steps: 100
save_steps: 100
save_total_limit: 2
logging_steps: 5
report_to:
  - tensorboard
seed: 0
data_seed: 0
add_version: false
output_dir: /knowin-oss/weilinruan/TopoPRM_ICLR27/canonical/sft_qwen35_9b
