# Stage 1 (exp_May18): Qwen2.5-7B long-CoT SFT warmup
model: /mnt/data/huggingface_downloads/models/qwen/Qwen2.5-7B-Instruct

dataset:
  - data/sft_ready/train_longcot_mix.jsonl

train_type: lora
lora_rank: 64
lora_alpha: 128
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_length: 8192
bf16: true
gradient_checkpointing: true

save_steps: 100
save_total_limit: 3
report_to:
  - tensorboard
  - wandb
logging_steps: 5

output_dir: output/sft_qwen25_7b_longcot_exp_may18
