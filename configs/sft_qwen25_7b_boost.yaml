# SFT boost: Qwen2.5-7B-Instruct ? more epochs + higher lr for better format compliance
# Previous SFT got format compliance 19-52%, need >80%
model: /mnt/data/huggingface_downloads/models/qwen/Qwen2.5-7B-Instruct

dataset:
  - data/sft_ready/train_augmented.jsonl

train_type: lora
lora_rank: 64
lora_alpha: 128
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1e-4
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_length: 4096
bf16: true
gradient_checkpointing: true

eval_strategy: steps
eval_steps: 100
save_steps: 100
save_total_limit: 3
report_to:
  - tensorboard
logging_steps: 5

output_dir: output/sft_qwen25_7b_boost
