# SFT tuned for private-data enhancement with anti-forgetting bias
model: Qwen/Qwen3-32B

dataset:
  - data/sft_ready/train_mixed.jsonl

train_type: lora
lora_rank: 64
lora_alpha: 128
target_modules: all-linear
lora_dropout: 0.03

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2e-5
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_length: 8192
bf16: true
gradient_checkpointing: true

eval_strategy: steps
eval_steps: 50
save_steps: 50
save_total_limit: 4
report_to:
  - tensorboard
  - wandb
logging_steps: 5

output_dir: output/sft_private_boost
