# SFT Stage-I: Qwen3.5-9B — Server A cold start
# Date: 2026-05-14
# Launch: bash scripts/run_sft_qwen35_9b_A.sh

model: /Knowin/foundation/weilinruan/hf_models/Qwen/Qwen3.5-9B

tuner_type: lora
lora_rank: 64
lora_alpha: 128

dataset:
  - data/grpo_ready/train_public_swift.jsonl

max_length: 4096
num_train_epochs: 2
learning_rate: 5.0e-5
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true

save_steps: 50
save_total_limit: 3
report_to:
  - tensorboard
logging_steps: 5

output_dir: output/sft_qwen35_9b_A
