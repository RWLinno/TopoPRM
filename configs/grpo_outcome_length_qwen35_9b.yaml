# GRPO length-aware baseline: outcome + format + length control, NO topology.
# Rebuttal baseline to isolate topology gains from brevity pressure
# (HxUk W2, B5w7 W3). Matched to grpo_hierarchical_qwen35_9b.yaml except reward.
model: Qwen/Qwen3.5-9B

dataset:
  - data/grpo_ready/train.jsonl

external_plugins:
  - src/reward/ablation_rewards.py
reward_funcs:
  - ablation_outcome_length

num_generations: 2
temperature: 0.8
max_completion_length: 1024
top_p: 0.95

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.6
vllm_max_model_len: 3072
vllm_enable_prefix_caching: false
sleep_level: 1
offload_model: true
offload_optimizer: true

tuner_type: lora
lora_rank: 64
lora_alpha: 128
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5e-6
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_length: 4096
bf16: true
gradient_checkpointing: true

save_steps: 50
save_total_limit: 3
report_to:
  - tensorboard
  - wandb
logging_steps: 5

output_dir: output/grpo_outcome_length_qwen35_9b
