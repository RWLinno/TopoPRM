model: /mnt/users/rwl/models/Qwen2.5-0.5B-doctor

dataset:
  - data/sft_ready/train_augmented.jsonl

train_type: lora
lora_rank: 32
lora_alpha: 64
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 3e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_length: 3072
bf16: true
gradient_checkpointing: true

eval_strategy: steps
eval_steps: 100
save_steps: 100
save_total_limit: 3
report_to:
  - tensorboard
  - wandb
logging_steps: 10

output_dir: output/sft_student_0p5b
