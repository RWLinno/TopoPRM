# SFT v2: Qwen2.5-7B-Instruct with improved format training
# Previous SFT had only 19-52% format compliance
# This version: 3 epochs, higher lr, to improve format learning
model: /mnt/data/huggingface_downloads/models/qwen/Qwen2.5-7B-Instruct

dataset:
  - data/sft_ready/train_augmented.jsonl

train_type: lora
lora_rank: 64
lora_alpha: 128
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_length: 4096
bf16: true
gradient_checkpointing: true

eval_strategy: steps
eval_steps: 50
save_steps: 50
save_total_limit: 3
report_to:
  - tensorboard
logging_steps: 5

output_dir: output/sft_qwen25_7b_v2
