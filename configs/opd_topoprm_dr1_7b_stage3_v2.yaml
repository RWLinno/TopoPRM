# Stage 3 v2: OPD for DR1-7B with SFT adapter initialization
# Fix: Student starts from SFT checkpoint for better init
# Teacher: Stage2 GRPO TopoPRM checkpoint (949 steps, best)

model: /root/.cache/modelscope/hub/models/deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
adapters:
  - output/sft_deepseek_r1_7b/final
teacher_model: /root/.cache/modelscope/hub/models/deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
teacher_adapters:
  - output/grpo_topoprm_dr1_7b_mcl4096/v0-20260517-172229/checkpoint-949

dataset:
  - data/grpo_ready/train_public_swift.jsonl

seq_kd: false
lmbda: 1.0
beta: 0.5
temperature: 1.2
sft_alpha: 0

max_length: 10240
max_completion_length: 8192
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.6
vllm_max_model_len: 10240
vllm_enable_prefix_caching: false
sleep_level: 1
offload_model: true
offload_optimizer: true

train_type: lora
lora_rank: 64
lora_alpha: 128
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1e-5
num_train_epochs: 1
max_steps: 200
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true
gradient_checkpointing: true

save_steps: 50
save_total_limit: 5
report_to:
  - tensorboard
  - wandb
logging_steps: 5
output_dir: output/opd_topoprm_dr1_7b_stage3_v2
