# GRPO + TopoPRM v2 config for DeepSeek-R1-Distill-Qwen-7B
#
# This config is identical to grpo_topoprm_deepseek_r1_7b.yaml EXCEPT that
# it enables the P0+P2+P3+P4+P5 patches via environment variables.
# The reward function class is unchanged (topo_hierarchical); the patches
# are read at runtime from env vars by RewardConfig.
#
# Launch with:
#   bash scripts/run_grpo_topoprm_v2.sh grpo_topoprm_v2
#
# Or manually:
#   TOPO_RESCALE_PATCH=1 TOPO_HIER_AGG=multiplicative \
#   TOPO_CONT_REQUIRE_EVIDENCE=1 TOPO_DAG_SENTENCE_FALLBACK=1 \
#   TOPO_LENGTH_UNIT=tokens TOPO_LENGTH_LOW=512 TOPO_LENGTH_HIGH=8192 \
#     bash scripts/run_grpo.sh grpo_topoprm_v2
#
# See docs/method_diagnosis_2026-05-14.md for rationale.

model: ${HF_MODELS_DIR:-./models}/deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
model_type: qwen2_5

train_type: lora
lora_rank: 64
lora_alpha: 128
lora_target_modules: ALL

# SFT adapter as init (same as v1)
adapters:
  - output/sft_deepseek_r1_7b/final

rlhf_type: grpo
num_generations: 4
group_size: 4
max_completion_length: 4096

external_plugins: src/reward/composite_reward.py
reward_funcs: topo_hierarchical

dataset:
  - type: jsonl
    path: data/grpo_ready/train_public.jsonl

max_steps: 200
learning_rate: 5.0e-6
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
kl_coeff: 0.04
save_steps: 50
output_dir: output/grpo_topoprm_v2
report_to:
  - tensorboard
  - wandb
logging_steps: 5

# ──────────────────────────────────────────────────────────────────────────────
# v2 patch environment variables (set by run_grpo_topoprm_v2.sh, documented
# here for reproducibility). These are NOT ms-swift config keys; they are read
# by src/reward/reward_config.py at import time.
#
# P0: dead-band batch rescaling (prevents topology noise from dominating
#     outcome on saturated benchmarks like GSM8K/MATH500)
#   TOPO_RESCALE_PATCH=1
#   TOPO_RESCALE_MIN_SPAN=0.05
#
# P2: true multiplicative aggregation (outcome=0 => r_total=0)
#   TOPO_HIER_AGG=multiplicative
#
# P3: continuity reward requires evidence (no free pass for empty steps)
#   TOPO_CONT_REQUIRE_EVIDENCE=1
#
# P4: DAG sentence-level fallback (natural CoT without explicit markers)
#   TOPO_DAG_SENTENCE_FALLBACK=1
#   TOPO_DAG_SENTENCE_MIN_LEN=20
#
# P5: length reward in tokens (not characters), with math-appropriate range
#   TOPO_LENGTH_UNIT=tokens
#   TOPO_LENGTH_LOW=512
#   TOPO_LENGTH_HIGH=8192
# ──────────────────────────────────────────────────────────────────────────────
