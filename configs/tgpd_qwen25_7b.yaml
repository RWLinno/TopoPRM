# TGPD Phase III: Topology-Guided Policy Distillation for Qwen2.5-7B
# Teacher = Stage-II TopoPRM (hierarchical) Qwen2.5-7B checkpoint
# Student = Qwen2.5-7B base (no SFT adapter ? the teacher IS the trained model)
#
# Note: The 7B teacher was trained with alpha=0.9 for 318 steps.

student_base: /mnt/data/huggingface_downloads/models/qwen/Qwen2.5-7B
student_adapter: ""

teacher_base: /mnt/data/huggingface_downloads/models/qwen/Qwen2.5-7B
teacher_adapter: output/grpo_hierarchical_qwen25_7b/v3-20260406-134423/checkpoint-318

dataset: data/grpo_ready/train.jsonl
dataset_split: D2

num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
max_length: 8192
max_new_tokens: 4096
bf16: true
gradient_checkpointing: true

kl_temperature: 1.0
topo_threshold: 0.5
use_topo_aware_pr: true

logging_steps: 10
save_steps: 100
save_total_limit: 3
output_dir: output/tgpd_qwen25_7b
