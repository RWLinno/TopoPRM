# TGPD Phase III: Topology-Guided Policy Distillation for Qwen3.5-9B
# Teacher = Stage-II TopoPRM (hierarchical) checkpoint
# Student = Qwen3.5-9B + SFT adapter (same init as GRPO runs)
#
# The teacher generates topology-aware revision signals; the student
# learns via token-level reverse-KL to match the teacher's distribution.

student_base: /mnt/data/huggingface_downloads/models/qwen/Qwen3.5-9B
student_adapter: output/sft_qwen35_9b/v0-20260407-011328/checkpoint-626

teacher_base: /mnt/data/huggingface_downloads/models/qwen/Qwen3.5-9B
teacher_adapter: output/grpo_hierarchical_qwen35_9b_mcl4096/v2-20260407-162048/checkpoint-79

dataset: data/grpo_ready/train.jsonl
dataset_split: D2

num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
max_length: 8192
max_new_tokens: 4096
bf16: true
gradient_checkpointing: true

# KL loss temperature
kl_temperature: 1.0

# Topology signals at training time
topo_threshold: 0.5
use_topo_aware_pr: true

logging_steps: 10
save_steps: 100
save_total_limit: 3
output_dir: output/tgpd_9b
