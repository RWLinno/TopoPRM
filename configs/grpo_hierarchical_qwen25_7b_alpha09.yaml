# 7B TopoHier with alpha=0.9 (topology-dominant) — sensitivity ablation vs
# default alpha=0.6.  Forks the successful 7B recipe in
# configs/grpo_hierarchical_qwen25_7b.yaml.  Single-GPU friendly: mcl=1024,
# num_generations=4, vllm colocate ratio 0.55.
model: /mnt/data/huggingface_downloads/models/qwen/Qwen2.5-7B-Instruct

dataset:
  - data/grpo_ready/train.jsonl

external_plugins:
  - src/reward/composite_reward.py
reward_funcs:
  - topo_hierarchical

num_generations: 4
temperature: 0.8
max_completion_length: 1024
top_p: 0.95

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.55
vllm_max_model_len: 5120
vllm_enable_prefix_caching: false
sleep_level: 1
offload_model: true
offload_optimizer: true

train_type: lora
lora_rank: 64
lora_alpha: 128
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5e-6
# v3 ran 318 steps on 6 GPUs = 1 epoch.  On 1 GPU, 1 epoch ≈ 1900 steps;
# we cap at 200 steps for a sensitivity signal.  If alpha=0.9 clearly
# degrades or improves by that point, we stop and move to alpha=0.3.
num_train_epochs: 1
max_steps: 200
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_length: 4096
bf16: true
gradient_checkpointing: true

save_steps: 50
save_total_limit: 4
report_to:
  - tensorboard
logging_steps: 5

output_dir: output/grpo_hierarchical_qwen25_7b_alpha09
