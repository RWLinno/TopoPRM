# On-Policy Self-Distillation (OPSD) — teacher == student, via disable_adapter
# Reference: ms-swift/examples/train/rlhf/opsd/opsd.sh
# Paper: https://arxiv.org/abs/2601.18734
# Entry: scripts/run_swift_rlhf.sh opsd_dr1_7b
#
# Unlike opd_*.yaml, here the teacher is the *frozen base model* (same weights
# as the student, with the LoRA adapter disabled). This matches TopoPRM's TVSD
# formulation where π_ref shares the backbone with π_θ.

model: /Knowin/foundation/weilinruan/hf_models/deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
teacher_model: /Knowin/foundation/weilinruan/hf_models/deepseek-ai/DeepSeek-R1-Distill-Qwen-7B

tuner_type: lora
lora_rank: 64
lora_alpha: 128
target_modules: all-linear

dataset:
  - data/grpo_ready/train_public.jsonl

# OPSD hyperparameters (follow paper defaults from opsd.sh):
#   temp=1.2, beta=0.5, lambda=1, sft_alpha=0
seq_kd: false
lmbda: 1.0
beta: 0.5
temperature: 1.2
sft_alpha: 0

max_length: 10240
max_completion_length: 2048
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.7
vllm_max_model_len: 10240
sleep_level: 1

num_train_epochs: 1
max_steps: 1000
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true
gradient_checkpointing: true

save_steps: 200
save_total_limit: 3
report_to:
  - tensorboard
  - wandb
logging_steps: 5
output_dir: output/opsd_dr1_7b
