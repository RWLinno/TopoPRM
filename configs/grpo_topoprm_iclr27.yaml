# Canonical Stage-II run: raw directed topology + topology-conditioned Choquet reward.
model: ${MODEL_ROOT}/Qwen/Qwen3.5-9B
adapters:
  - ${EXP_ROOT}/canonical/sft_qwen35_9b

rlhf_type: grpo
tuner_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
target_modules: all-linear
torch_dtype: bfloat16

external_plugins:
  - src/reward/composite_reward.py
reward_funcs:
  - topo_independent_choquet
dataset:
  - ${EXP_ROOT}/canonical/grpo_data/train_no_eval_overlap_max512.jsonl
truncation_strategy: delete

# Qwen3.5 is trained with the verified Transformers rollout path on this host.
# The installed real vLLM builds predate Qwen3.5; the newer builds require a
# CUDA/driver stack that is not available on the L20 node.
use_vllm: false
max_length: 512
max_completion_length: 4096
num_generations: 4
temperature: 0.9
top_p: 0.95

max_steps: 300
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.05
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
beta: 0.04
loss_type: grpo
scale_rewards: group
gradient_checkpointing: true
deepspeed: zero2

save_steps: 50
save_total_limit: 2
logging_steps: 5
log_completions: true
report_to:
  - tensorboard
seed: 0
data_seed: 0
add_version: false
output_dir: ${EXP_ROOT}/canonical/grpo_topoprm_qwen35_9b
