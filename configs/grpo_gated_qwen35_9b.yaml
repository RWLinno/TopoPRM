# GRPO: Outcome-gated topology reward (v2) with Qwen3.5-9B
# Fixes: truncation noise, reward hacking, variance collapse
# Key changes vs hierarchical: topo_gated reward, max_completion_length=2048
model: /mnt/data/huggingface_downloads/models/qwen/Qwen3.5-9B

dataset:
  - data/grpo_ready/train.jsonl

external_plugins:
  - src/reward/composite_reward.py
reward_funcs:
  - topo_gated

num_generations: 2
temperature: 0.8
max_completion_length: 2048
top_p: 0.95

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.6
vllm_max_model_len: 5120
vllm_enable_prefix_caching: false
sleep_level: 1
offload_model: true
offload_optimizer: true

train_type: lora
lora_rank: 64
lora_alpha: 128
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5e-6
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_length: 4096
bf16: true
gradient_checkpointing: true

save_steps: 50
save_total_limit: 3
report_to:
  - tensorboard
logging_steps: 5

output_dir: output/grpo_gated_qwen35_9b
