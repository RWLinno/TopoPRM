# Online reverse-KL distillation: teacher 32B -> student 4B
teacher_model: Qwen/Qwen3-32B
teacher_adapter: output/grpo_main/v3-20260318-211524/checkpoint-79
student_model: Qwen/Qwen3.5-4B

dataset:
  - data/sft_ready/train_augmented.jsonl

lora_rank: 64
lora_alpha: 128
target_modules: all-linear
lora_dropout: 0.05

temperature: 1.0
rkl_weight: 1.0
ce_weight: 0.05

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2e-5
num_train_epochs: 1
warmup_ratio: 0.05
weight_decay: 0.01
max_length: 2048
max_train_samples: 4000
bf16: true
gradient_checkpointing: true

logging_steps: 10
save_steps: 100
output_dir: output/distill_student_4b_compact_rkl
