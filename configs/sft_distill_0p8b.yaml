# SFT distillation to 0.8B student (extreme compression)
# Strategy: even smaller lr, rank-32 LoRA to avoid overfitting on small backbone
model: Qwen/Qwen3.5-0.8B

dataset:
  - data/sft_ready/train_mixed.jsonl

train_type: lora
lora_rank: 32
lora_alpha: 64
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 16
gradient_accumulation_steps: 1
learning_rate: 1e-4
num_train_epochs: 4
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_length: 4096
bf16: true
gradient_checkpointing: true

eval_strategy: steps
eval_steps: 100
save_steps: 100
save_total_limit: 3
report_to:
  - tensorboard
logging_steps: 10

output_dir: output/sft_distill_0p8b
