# GRPO + TopoPRM v2 — Server A run (Qwen3.5-9B)
# Launch: bash scripts/run_grpo_topoprm_v2_A.sh --config configs/grpo_topoprm_v2_qwen35_9b_A.yaml

model: ${MODEL_ROOT}/Qwen/Qwen3.5-9B

tuner_type: lora
lora_rank: 64
lora_alpha: 128

adapters:
  - output/sft_qwen35_9b_A/final

rlhf_type: grpo
num_generations: 4
max_completion_length: 4096
beta: 0.04
use_vllm: false

external_plugins:
  - src/reward/composite_reward.py
reward_funcs:
  - topo_hierarchical

dataset:
  - data/grpo_ready/train_public_swift.jsonl

max_steps: 200
learning_rate: 5.0e-6
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
save_steps: 50
output_dir: output/grpo_topoprm_v2_qwen35_9b_A
report_to:
  - tensorboard
  - wandb
logging_steps: 5
