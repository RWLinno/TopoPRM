# SFT distillation to 2B student (aggressive compression target)
# Strategy: same mixed data as 4B, but lower lr and more epochs for smaller capacity
model: Qwen/Qwen3.5-2B

dataset:
  - data/sft_ready/train_mixed.jsonl

train_type: lora
lora_rank: 64
lora_alpha: 128
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 5e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_length: 4096
bf16: true
gradient_checkpointing: true

eval_strategy: steps
eval_steps: 100
save_steps: 100
save_total_limit: 3
report_to:
  - tensorboard
logging_steps: 10

output_dir: output/sft_distill_2b
