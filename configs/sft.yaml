# ─── SFT: Qwen3-32B on structured math reasoning data ───
model: Qwen/Qwen3-32B

dataset:
  - data/sft_ready/train_augmented.jsonl  # 5000 samples (637 ZH + 3000 NuminaMath + 2000 MetaMath)

# LoRA
train_type: lora
lora_rank: 64            # low-rank dimension
lora_alpha: 128          # scaling factor (alpha/rank = 2)
target_modules: all-linear
lora_dropout: 0.05

# Training
per_device_train_batch_size: 2
gradient_accumulation_steps: 8   # effective batch = 2 * 8 * num_gpus
learning_rate: 5e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_length: 8192                 # max input sequence length
bf16: true
gradient_checkpointing: true     # trade compute for memory

# Checkpointing & logging
eval_strategy: steps
eval_steps: 50
save_steps: 50
save_total_limit: 3
report_to:
  - tensorboard
  - wandb
logging_steps: 5

output_dir: output/sft
